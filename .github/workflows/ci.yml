name: CI

# The test suite was not runnable and nothing ran on push, which is how a
# balance bug and three deletion-ordering bugs survived unnoticed. Everything
# below is a command that already passes locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: myfinanceapp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: myfinanceapp/app
        env:
          JWT_SECRET_KEY: ci-secret-not-used-outside-tests
          PYTHONPATH: ${{ github.workspace }}/myfinanceapp/app
        run: pytest tests/ -q --cov=. --cov-report=term-missing:skip-covered

  mylife360-backend:
    name: MyLife360 backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Python as the add-on image (Home Assistant base, Alpine 3.24).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            traccar-backend/app/requirements.txt
            traccar-backend/app/tests/requirements-test.txt

      - name: Install dependencies
        working-directory: traccar-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt -r app/tests/requirements-test.txt

      - name: Run tests
        working-directory: traccar-backend
        env:
          PYTHONPATH: ${{ github.workspace }}/traccar-backend
        run: pytest -q

  frontend:
    name: Frontend typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: myfinanceapp/frontend/package-lock.json

      - name: Install dependencies
        working-directory: myfinanceapp/frontend
        run: npm ci

      - name: Typecheck
        working-directory: myfinanceapp/frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: myfinanceapp/frontend
        run: npm run lint

      - name: Build
        working-directory: myfinanceapp/frontend
        run: npm run build

  data-hygiene:
    name: No application data committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject databases, dumps and trained models
        run: |
          # Same contract as .githooks/pre-commit, enforced for anything that
          # reaches the remote — including pushes made with --no-verify.
          offenders=$(git ls-files | grep -iE '\.(db|sqlite|sqlite3|pkl|joblib)$|\.db\.gz$|backup_metadata\.json' || true)
          if [ -n "$offenders" ]; then
            echo "Application data must never be committed:"
            echo "$offenders" | sed 's/^/  /'
            exit 1
          fi
          echo "No application data under version control."

      - name: Reject virtualenvs and bytecode
        run: |
          offenders=$(git ls-files | grep -E '(^|/)(\.venv|venv|__pycache__|node_modules)/|\.pyc$' || true)
          if [ -n "$offenders" ]; then
            echo "Build artefacts must not be committed:"
            echo "$offenders" | head -20 | sed 's/^/  /'
            exit 1
          fi
          echo "No virtualenvs or bytecode under version control."
